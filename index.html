<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f3e51">
<meta name="description" content="iDz - check your ID photo before you send it.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>iDz</title>
<style>
:root{
  --bg:#2f3e51;--bg2:#27354a;--panel:#384a61;--panel2:#41546d;--line:#4c607a;
  --text:#ffffff;--dim:#b7c3d1;--green:#27af7a;--green2:#2fd394;--amber:#f2b93b;--red:#ef5d5d;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.screen{position:fixed;inset:0;display:none;flex-direction:column;overflow:auto}
.screen.on{display:flex}
.wrap{width:100%;max-width:520px;margin:0 auto;padding:0 16px}

/* header */
header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 0 6px}
header img{height:46px;width:auto;display:block}
.lang{display:flex;gap:4px;background:var(--bg2);border-radius:999px;padding:4px}
.lang button{border:0;background:transparent;color:var(--dim);border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer}
.lang button.on{background:var(--panel2);color:var(--text)}

/* home */
.hero{padding:26px 0 8px}
.hero h1{font-size:28px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--green2)}
.hero p{color:var(--dim);margin-top:10px;font-size:16px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0 4px}
.steps div{background:var(--bg2);border-radius:12px;padding:12px 10px}
.steps b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--green);font-size:13px;margin-bottom:6px}
.steps span{display:block;font-size:13px;color:var(--dim);line-height:1.3}
.choice{display:grid;gap:12px;margin-top:22px}
.consent{display:grid;gap:12px;margin-top:22px;background:var(--panel);border-radius:var(--radius);padding:14px 16px}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;cursor:pointer}
.ck input{flex:none;width:20px;height:20px;margin:1px 0 0;accent-color:var(--green)}
.ck.need span{color:var(--red)}
.consent a,footer a{color:var(--green2)}
.doc{display:flex;align-items:center;gap:14px;text-align:start;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:border-color .15s,transform .1s}
.doc:active{transform:scale(.99)}
.doc:hover{border-color:var(--green)}
.doc .shape{flex:none;width:52px;height:34px;border-radius:6px;border:2px solid var(--green2);position:relative}
.doc .shape.pp{width:38px;height:50px}
.doc .shape.chip::before{content:"";position:absolute;left:8px;top:7px;width:14px;height:11px;border-radius:3px;background:var(--green2)}
.keyform{margin-top:14px;background:var(--panel);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.keyform label{font-size:13px;color:var(--dim);margin-top:6px}
.keyform input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font-size:18px;letter-spacing:1px}
.doc .shape::after{content:"";position:absolute;left:6px;right:6px;bottom:6px;height:3px;border-radius:2px;background:var(--green2);opacity:.7}
.doc strong{display:block;font-size:17px}
.doc small{display:block;color:var(--dim);font-size:14px}
.doc .go{margin-inline-start:auto;color:var(--dim);font-size:22px}
.codeBox{margin-top:24px;background:var(--panel);border-radius:var(--radius);padding:18px}
.codeBox label{display:block;font-weight:700;margin-bottom:4px}
.codeBox p{color:var(--dim);font-size:14px;margin-bottom:12px}
.codeBox input{display:block;width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font-size:22px;letter-spacing:6px;text-align:center}
.status{display:flex;align-items:center;gap:8px;margin-top:18px;color:var(--dim);font-size:14px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.status.ok i{background:var(--green2)} .status.bad i{background:var(--red)}
.err{color:var(--red);margin-top:12px;font-size:15px}
footer{margin-top:auto;padding:24px 0 calc(env(safe-area-inset-bottom) + 18px);color:var(--dim);font-size:12px;text-align:center}

.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;cursor:pointer;margin-top:12px;color:#fff;background:var(--green)}
.btn:active{background:#229b6c}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.ghost:active{background:var(--panel)}

/* camera */
#cam{background:#000;overflow:hidden}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#frame{position:absolute;border-radius:14px;box-shadow:0 0 0 9999px rgba(20,28,40,.62);pointer-events:none}
#frame .c{position:absolute;width:34px;height:34px;border:4px solid var(--c,#fff);transition:border-color .15s}
#frame .tl{top:-4px;left:-4px;border-right:0;border-bottom:0;border-top-left-radius:16px}
#frame .tr{top:-4px;right:-4px;border-left:0;border-bottom:0;border-top-right-radius:16px}
#frame .bl{bottom:-4px;left:-4px;border-right:0;border-top:0;border-bottom-left-radius:16px}
#frame .br{bottom:-4px;right:-4px;border-left:0;border-top:0;border-bottom-right-radius:16px}
#frame.good{--c:var(--green2)} #frame.bad{--c:var(--amber)}
/* where the NIN sits on the front (template box 398,288-660,323 of 800x516) */
#frame .nin{position:absolute;left:49.75%;top:55.8%;width:32.75%;height:6.8%;border:2px dashed var(--c,#fff);border-radius:6px;opacity:.9;display:none}
#frame.front .nin{display:block}
#frame .nin em{position:absolute;bottom:100%;inset-inline-start:0;margin-bottom:3px;font-style:normal;font-size:12px;font-weight:700;background:rgba(20,28,40,.75);border-radius:6px;padding:1px 6px;white-space:nowrap}
#frame .scan{position:absolute;left:8px;right:8px;height:2px;top:50%;background:linear-gradient(90deg,transparent,var(--green2),transparent);box-shadow:0 0 12px var(--green2);animation:scan 2.4s ease-in-out infinite;opacity:.85}
@keyframes scan{0%,100%{top:12%}50%{top:88%}}
/* selfie: oval guide, mirrored preview (like a mirror: the person's left is the screen's left), turn arrows */
#video.mirror{transform:scaleX(-1)}
#frame.selfie{border-radius:50%;border:4px solid var(--c,#fff)}
#frame.selfie .c,#frame.selfie .scan{display:none}
#frame .arrow{position:absolute;top:50%;transform:translateY(-50%);font-style:normal;font-size:60px;font-weight:900;line-height:1;color:var(--green2);text-shadow:0 0 14px rgba(0,0,0,.7);display:none}
#frame .arrow.l{display:block;left:6px} #frame .arrow.r{display:block;right:6px}
#camTop{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 16px 0;text-align:center}
.bar{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.bar span{height:4px;width:44px;border-radius:2px;background:rgba(255,255,255,.25)}
.bar span.on{background:var(--green2)}
#camTitle{font-size:20px;font-weight:800}
#camSub{color:var(--dim);font-size:15px}
#hint{position:absolute;left:16px;right:16px;text-align:center}
#hint span{display:inline-block;background:rgba(20,28,40,.75);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600}
#hint span:empty{display:none}
#camBottom{position:absolute;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom) + 24px);display:flex;align-items:center;justify-content:space-between}
#shoot{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:var(--green);cursor:pointer;flex:none;box-shadow:0 0 0 6px rgba(39,175,122,.25)}
#shoot:active{transform:scale(.94)}
.small{background:rgba(20,28,40,.7);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:10px 12px;font-size:14px;cursor:pointer;min-width:88px}

/* wait */
#wait,#chip{align-items:center;justify-content:center;text-align:center}
#chip .wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%}
#chip .card{width:132px;height:84px;border:3px solid var(--green2);border-radius:12px;margin-bottom:24px;animation:pulse 1.4s ease-in-out infinite}
#chip h2{font-size:20px;line-height:1.3;max-width:320px} #chip p{color:var(--dim);margin-top:10px;max-width:320px}
#wait img{height:64px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5;transform:scale(.97)}}
#wait p{color:var(--dim);margin-top:18px}
.track{width:180px;height:4px;border-radius:2px;background:var(--panel);margin:18px auto 0;overflow:hidden;position:relative}
.track::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:var(--green2);border-radius:2px;animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{left:-40%}100%{left:100%}}

/* result */
.banner{display:flex;gap:12px;align-items:center;border-radius:var(--radius);padding:16px;margin-top:16px;background:var(--panel)}
.banner .dot{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:20px;color:#fff}
.banner.info .dot{background:var(--green2)} .banner.ok .dot{background:var(--green)} .banner.warn .dot{background:var(--amber);color:#2b2b2b} .banner.bad .dot{background:var(--red)}
.banner h2{font-size:19px;line-height:1.25}
.banner p{color:var(--dim);font-size:14px}
.shot{position:relative;margin-top:14px}
.shot img{width:100%;border-radius:14px;display:block;border:1px solid var(--line)}
.shot.portrait img{width:auto;max-width:100%;max-height:300px;margin:0 auto}
.shot span{position:absolute;top:10px;inset-inline-start:10px;background:rgba(20,28,40,.8);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
.issue{border-radius:14px;padding:14px;margin-top:10px;background:var(--panel);border-inline-start:4px solid var(--amber)}
.issue.damage,.issue.wrong,.issue.face{border-inline-start-color:var(--red)}
.issue b{display:block;margin-bottom:2px}
.issue span{color:var(--dim);font-size:15px}
.read{margin-top:14px;background:var(--panel);border-radius:14px;padding:4px 14px}
.read h3{font-size:14px;color:var(--dim);font-weight:600;padding:10px 0 4px}
.read div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.read div span{color:var(--dim)}
.read div b{text-align:end}
.read small.same{display:block;color:var(--green2);font-size:12px;font-weight:600}
.issue .diff{display:block;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.issue .diff b{display:inline;margin:0}
.issue .diff span{display:block;color:var(--text);font-size:14px}
.read div.ninimg{display:block;border-top:0;padding:0 0 12px}
.read div.ninimg img{display:block;width:100%;border-radius:8px;border:1px solid var(--line)}
.read div.ninimg small{display:block;color:var(--dim);font-size:12px;margin-top:4px}
#resBtns{padding-bottom:calc(env(safe-area-inset-bottom) + 20px)}

/* done */
#done .big{width:84px;height:84px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin:16vh auto 18px;font-size:42px;font-weight:900}
#done h1{text-align:center;font-size:26px}
#done p{text-align:center;color:var(--dim);margin-top:8px}

[dir=rtl] .doc .go{transform:scaleX(-1)}
</style>
</head>
<body>

<section class="screen on" id="home"><div class="wrap" style="display:flex;flex-direction:column;min-height:100%">
  <header>
    <img src="logo.png" alt="iDz">
    <div class="lang" id="lang"><button data-l="en">EN</button><button data-l="fr">FR</button><button data-l="ar">عربي</button></div>
  </header>
  <div class="hero">
    <h1 data-t="heroTitle"></h1>
    <p data-t="heroText"></p>
  </div>
  <div class="steps">
    <div><b>1</b><span data-t="step1"></span></div>
    <div><b>2</b><span data-t="step2"></span></div>
    <div><b>3</b><span data-t="step3"></span></div>
  </div>
  <div class="codeBox" id="codeBox" style="display:none">
    <label for="codeIn" data-t="codeLabel"></label>
    <p data-t="codeText"></p>
    <input id="codeIn" inputmode="numeric" autocomplete="off" maxlength="12">
    <button class="btn" id="codeGo" data-t="continue"></button>
  </div>
  <div class="consent" id="consent" style="display:none">
    <label class="ck" id="ckMainL"><input type="checkbox" id="ckMain"><span data-t="consentMain"></span></label>
  </div>
  <div class="choice" id="docChoice" style="display:none">
    <button class="doc" data-doc="chip" id="docChip" style="display:none"><i class="shape chip"></i><span><strong data-t="docChip"></strong><small data-t="docChipSub"></small></span><span class="go">&rsaquo;</span></button>
    <button class="doc" data-doc="id"><i class="shape"></i><span><strong data-t="docId"></strong><small data-t="docIdSub"></small></span><span class="go">&rsaquo;</span></button>
    <button class="doc" data-doc="passport"><i class="shape pp"></i><span><strong data-t="docPp"></strong><small data-t="docPpSub"></small></span><span class="go">&rsaquo;</span></button>
  </div>
  <div class="status" id="status" style="display:none"><i></i><span></span></div>
  <p class="err" id="homeErr"></p>
  <footer><span data-t="footer"></span> · <a class="pv" href="privacy.html" target="_blank"><span data-t="privacyLink"></span></a></footer>
</div></section>

<section class="screen" id="cam">
  <video id="video" playsinline muted autoplay></video>
  <div id="frame"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i><i class="nin"><em data-t="ninBox"></em></i><i class="scan"></i><i class="arrow" id="arrow"></i></div>
  <div id="camTop"><div class="bar" id="camBar"></div><div id="camTitle"></div><div id="camSub"></div></div>
  <div id="hint"><span></span></div>
  <div id="camBottom">
    <button class="small" id="camBack" data-t="back"></button>
    <button id="shoot" aria-label="Take photo"></button>
    <button class="small" id="autoBtn"></button>
  </div>
  <input type="file" id="fileIn" accept="image/*" capture="environment" hidden>
</section>

<section class="screen" id="wait">
  <img src="logo.png" alt="">
  <p><span data-t="checking"></span> <span id="waitSec"></span></p>
  <div class="track"></div>
</section>

<section class="screen" id="chip"><div class="wrap">
  <div class="card"></div><h2 data-t="chipHold"></h2><p data-t="chipHoldSub"></p>
  <button class="btn ghost" id="chipCancel" data-t="chipCancel" style="max-width:320px"></button>
</div></section>

<section class="screen" id="res"><div class="wrap">
  <div class="banner" id="banner"><div class="dot"></div><div><h2 id="resTitle"></h2><p id="resSub"></p></div></div>
  <div class="shot"><img id="shot" alt=""><span id="shotTag"></span></div>
  <div id="resBody"></div>
  <div id="resBtns"></div>
</div></section>

<section class="screen" id="done"><div class="wrap">
  <div class="big">&#10003;</div>
  <h1 data-t="sent"></h1>
  <p id="doneText"></p>
  <button class="btn" id="again" data-t="again" style="margin-top:28px"></button>
</div></section>

  let r;
  try { r = await fetch(API + '/' + path, {method: 'POST', signal: ctl.signal, headers: {'Content-Type': 'application/json', 'X-Access': CODE}, body: JSON.stringify(body)}); }
  catch (e) { throw new Error(e.name === 'AbortError' ? t('noAnswer') : t('noReach')); }
  finally { clearTimeout(to); }
  if (!r.ok) throw new Error(t('noReach') + ' (' + r.status + ')');
  const j = await r.json();
  if (j.code === 'bad_access') { stopCam(); show('home'); askCode(t('badCode')); throw new Error('access code'); }
  return j;
}
async function checkPhoto(dataUrl) {
  show('wait');
  const step = S.step, body = {step};
  if (step === 'back') { body.front = S.front; body.back = dataUrl; } else if (step === 'mrz') body.back = dataUrl; else body.front = dataUrl;
  let r;
  try { r = await api('api/check', body); } catch (e) { if (e.message === 'access code') return; r = {ok: false, msg: e.message}; }
  S.history.push({step, issues: (r.issues || []).map(i => i.code), ms: r.ms});
  showResult(step, dataUrl, r);
}

function renderResult(o) {
  show('res');
  const b = $('#banner'); b.className = 'banner ' + o.kind;
  b.querySelector('.dot').textContent = o.kind === 'ok' ? '✓' : o.kind === 'info' ? 'i' : '!';
  $('#resTitle').textContent = o.title; $('#resSub').textContent = o.sub || '';
  const shot = $('.shot'); shot.style.display = o.img ? 'block' : 'none'; shot.classList.toggle('portrait', !!o.portrait);
  if (o.img) { $('#shot').src = o.img; $('#shotTag').textContent = o.tag || ''; }
  const body = $('#resBody'); body.innerHTML = '';
  o.issues.forEach(i => {
    const tx = (ISSUE[LANG] && ISSUE[LANG][i.code]) || ISSUE.en[i.code] || [i.title, i.text];
    const d = document.createElement('div'); d.className = 'issue ' + i.kind;
    d.innerHTML = '<b></b><span></span>'; d.querySelector('b').textContent = tx[0]; d.querySelector('span').textContent = tx[1];
    (i.diffs || []).forEach(df => {      // front vs back, per field
      const v = x => x == null ? t('notRead') : (df.field === 'sex' ? (x === 'F' ? t('female') : x === 'M' ? t('male') : x) : x);
      const l = document.createElement('div'); l.className = 'diff';
      l.innerHTML = '<b></b><span></span>'; l.querySelector('b').textContent = t(FIELD_KEY[df.field] || df.field);
      const sp = l.querySelector('span');   // <bdi> keeps each value's own direction (dates stay 1995-08-19 in Arabic)
      [[t('frontLbl'), v(df.front)], [t('backLbl'), v(df.back)]].forEach(([lab, val], j) => {
        if (j) sp.appendChild(document.createTextNode('  |  '));
        sp.appendChild(document.createTextNode(lab + ': '));
        const bi = document.createElement('bdi'); bi.dir = /[؀-ۿ]/.test(val) ? 'rtl' : 'ltr'; bi.textContent = val; sp.appendChild(bi);
      });
      d.appendChild(l);
    });
    body.appendChild(d);
  });
  const rd = o.read || {};
  const sex = rd.sex === 'F' ? t('female') : rd.sex === 'M' ? t('male') : null;
  const rows = [['surname', rd.last], ['given', rd.first], ['nin', rd.nin], ['cardNo', rd.card_no], ['birth', rd.dob],
                ['sex', sex], ['commune', rd.commune], ['issueDate', rd.issue], ['expiry', rd.expiry], ['number', rd.number]].filter(x => x[1]);
  if (rows.length) {
    const box = document.createElement('div'); box.className = 'read';
    box.innerHTML = '<h3></h3>'; box.querySelector('h3').textContent = t('isRight');
    rows.forEach(([k, v]) => {
      const d = document.createElement('div'); d.innerHTML = '<span></span><b dir="auto"></b>'; d.querySelector('span').textContent = t(k); d.querySelector('b').textContent = v; box.appendChild(d);
      if (rd.match && rd.match[MATCH_KEY[k]]) { const s = document.createElement('small'); s.className = 'same'; s.textContent = t('sameBack'); d.querySelector('span').appendChild(s); }
      if (k === 'nin' && o.ninImg) {   // the exact image the NIN reader read, to compare with the number above
        const im = document.createElement('div'); im.className = 'ninimg';
        im.innerHTML = '<img alt=""><small></small>'; im.querySelector('img').src = 'data:image/png;base64,' + o.ninImg;
        im.querySelector('small').textContent = t('ninSaw'); box.appendChild(im);
      }
    });
    body.appendChild(box);
  }
  if (o.note) {        // [title, [[label, value], ...]]
    const box = document.createElement('div'); box.className = 'read';
    box.innerHTML = '<h3></h3>'; box.querySelector('h3').textContent = o.note[0];
    o.note[1].forEach(([k, v]) => { const d = document.createElement('div'); d.innerHTML = '<span></span><b dir="ltr"></b>'; d.querySelector('span').textContent = k; d.querySelector('b').textContent = v; box.appendChild(d); });
    body.appendChild(box);
  }
  const btns = $('#resBtns'); btns.innerHTML = '';
  o.buttons.forEach(([txt, fn, ghost]) => { const x = document.createElement('button'); x.className = 'btn' + (ghost ? ' ghost' : ''); x.textContent = txt; x.onclick = fn; btns.appendChild(x); });
  $('#res').scrollTop = 0;
}

function showResult(step, dataUrl, r) {
  if (step === 'mrz') { S.back = dataUrl; S.keyResp = r; return keyScreen(); }
  const tag = t(step === 'front' ? 'tagFront' : step === 'back' ? 'tagBack' : 'tagPp');
  if (!r.ok) return renderResult({kind: 'bad', title: t('failed'), sub: r.msg || t('failedSub'), img: dataUrl, tag, issues: [], read: {}, buttons: [[t('tryAgain'), () => openCam(step)]]});
  const issues = r.issues || [];
  const wrong = issues.some(i => i.kind === 'wrong'), damaged = issues.some(i => i.code === 'damage'),
        red = issues.some(i => i.kind === 'damage');
  const look = () => ({kind: red || wrong ? 'bad' : 'warn',
                       title: damaged && !wrong ? t('damaged') : t('problem'),
                       sub: damaged && !wrong ? t('damagedSub') : t('problemSub')});

  // FRONT: photo problems only, no details yet (user: nothing is shown until both sides are in and they match)
  if (step === 'front') {
    S.front = dataUrl; S.frontIssues = issues;
    const goOn = () => { if (S.back) finalCheck(); else openCam('back'); };   // back already taken -> re-check both
    if (!issues.length) return goOn();
    const buttons = [[t('retake'), () => openCam('front')]];
    if (!wrong) buttons.push([t('contAnyway'), goOn, true]);
    return renderResult(Object.assign(look(), {img: dataUrl, tag, issues, read: {}, buttons}));
  }

  // PASSPORT: one photo
  if (step === 'passport') {
    S.front = dataUrl;
    const buttons = issues.length ? [[t('retake'), () => openCam('passport')], [t('contAnyway'), () => toSelfie(issues, r.read, true), true]]
                                  : [[t('toSelfie'), () => toSelfie(issues, r.read, false)], [t('retake'), () => openCam('passport'), true]];
    return renderResult(Object.assign(issues.length ? look() : {kind: 'ok', title: t('okAll'), sub: t('okSub')},
                                      {img: dataUrl, tag, issues, read: r.read, buttons}));
  }

  // BACK = the final answer: both sides checked, front details compared with the back
  S.back = wrong ? null : dataUrl;
  const all = (S.frontIssues || []).filter(i => i.kind !== 'wrong').concat(issues);
  const rd = r.read || {};
  const FRONT_CODES = ['unreadable', 'face_light', 'no_face', 'nin_unread', 'not_front'];
  const needFront = all.some(i => FRONT_CODES.includes(i.code) || (i.code === 'mismatch' && (i.redo || []).includes('front')) || (i.code === 'damage' && i.side === 'front'));
  const needBack = all.some(i => ['back_unread', 'front_again'].includes(i.code) || (i.code === 'mismatch' && (i.redo || []).includes('back')) || (i.code === 'damage' && i.side === 'back'));
  const anyRed = all.some(i => i.kind === 'damage' || i.kind === 'wrong'), anyDamage = all.some(i => i.code === 'damage');
  let o;
  if (!all.length) {
    o = {kind: 'ok', title: t('okAll'), sub: t('okSub'), buttons: [[t('toSelfie'), () => toSelfie([], rd, false)], [t('retakeBack'), () => openCam('back'), true]]};
  } else {
    const buttons = [];
    if (needFront) buttons.push([t('retakeFront'), () => openCam('front')]);
    if (needBack || !needFront) buttons.push([t('retakeBack'), () => openCam('back'), buttons.length > 0]);
    if (!wrong) buttons.push([t('contAnyway'), () => toSelfie(all, rd, true), true]);
    o = {kind: anyRed ? 'bad' : 'warn', title: anyDamage ? t('damaged') : t('problem'), sub: anyDamage ? t('damagedSub') : t('problemSub'), buttons};
  }
  renderResult(Object.assign(o, {img: dataUrl, tag, issues: all, read: rd, ninImg: r.nin_img}));
}
function finalCheck() { S.step = 'back'; checkPhoto(S.back); }
const FIELD_KEY = {dob: 'birth', expiry: 'expiry', sex: 'sex', card_no: 'cardNo'};
const MATCH_KEY = {birth: 'dob', expiry: 'expiry', sex: 'sex', cardNo: 'card_no'};

async function send(issues, read, forced) {
  show('wait');
  try {
    const r = await api('api/send', {doc: S.doc, step: S.step, front: S.front, back: S.back, selfie: S.selfie, face: S.face, issues, read, forced, history: S.history, consent: S.consent, chip: S.chip || null});
    if (!r.ok) throw new Error(r.msg || 'not saved');
    stopCam();
    $('#doneText').textContent = r.saved === false ? t('sentDemo') : forced ? t('sentForced') : t('sentOk');
    show('done');
  } catch (e) {
    renderResult({kind: 'bad', title: t('failed'), sub: e.message, img: null, issues: [], read: {}, buttons: [[t('tryAgain'), () => send(issues, read, forced)]]});
  }
}

setLang(LANG);
boot();
</script>
